[tool.poetry]
name = "ekirjasto-data-api"
description = ""
authors = ["National Library of Finland"]
readme = "README.md"
packages = [{include = "ekirjasto_data_api"}]
version = "0"  # Version number is managed with tags in git

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.162.0"
SQLAlchemy = "^2.1.6"
opensearch-py = "^3.2.0"
uvicorn = "^0.54.0"
pydantic-settings = "^2.16.1"
psycopg = {version = "^3.3.6", extras = ["binary"]}
Brotli = "^1.2.1"
setuptools = ">=84.1.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pytest = "^9.1.1"
httpx2 = "^2.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
